<!doctype html>
<!--
  The itch.io embed for Outpost. It shows the live GitHub Pages build in a full-size frame,
  so the itch page always runs the newest version. Zip this one file and upload it as an
  HTML game (see docs/ITCH.md).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Outpost</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe
      src="https://jxstrr0.github.io/Outpost-/"
      title="Outpost"
      allow="autoplay; fullscreen; gamepad; pointer-lock"
      allowfullscreen
    ></iframe>
  </body>
</html>
